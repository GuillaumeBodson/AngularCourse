<mat-sidenav-container class="app-container">

  <mat-sidenav mode="side" [opened]="menuService.isMenuOpen()" >
    <mat-toolbar color="primary">

      <button matMiniFab color="secondary" [hidden]="!this.menuService.isMenuOpen()" (click)="this.menuService.toggle()">
        <mat-icon>menu</mat-icon>
      </button>
    </mat-toolbar>

    <mat-nav-list>
      <app-menu></app-menu>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <app-header></app-header>
    <app-content></app-content>
    <app-footer></app-footer>
  </mat-sidenav-content>

</mat-sidenav-container>
